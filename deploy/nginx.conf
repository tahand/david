# Production Nginx site for the clinic (SPEC §12.3). Installed by provision.sh
# as /etc/nginx/sites-available/clinic, with __DOMAIN__ replaced by the real
# hostname.
#
# Security headers MUST match packages/shared/src/security.ts; the test
# apps/api/src/securityHeaders.test.ts fails if they drift. Nginx drops
# server-level add_header lines inside any location that sets its own, so
# each location repeats them.

# Rate-limit abusive clients before they reach Node (the API has its own limits).
limit_req_zone $binary_remote_addr zone=clinic_api:10m rate=20r/s;

# HTTP: ACME challenges for certbot, everything else to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;
  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  # Ubuntu 24.04 ships Nginx 1.24, which predates the separate `http2 on;` directive.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name __DOMAIN__;
  server_tokens off;

  # --- TLS (Mozilla "intermediate": TLS 1.2 + 1.3). Certificates from certbot.
  ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:clinic_tls:10m;
  ssl_session_tickets off;
  # No OCSP stapling: Let's Encrypt retired OCSP in 2025.

  root /opt/clinic-app/apps/web/dist;
  index index.html;

  # SPEC §12.3; the API itself rejects bodies over 100 KB.
  client_max_body_size 10m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # --- API: same origin, so no CORS (SPEC §11).
  location /api/ {
    limit_req zone=clinic_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append: the API trusts exactly one proxy hop
    # (trust proxy = 1), so a client-supplied X-Forwarded-For must not survive.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # The API sets its own security headers (helmet); add HSTS for the origin.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # --- Hashed build assets: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }

  # --- The SPA: client-side routes fall back to index.html, never cached.
  location / {
    add_header Cache-Control "no-store";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri /index.html;
  }
}
