# Local Docker only. Mirrors the production layout (SPEC §12.3): Nginx serves
# the SPA and proxies /api to the Node app on the same origin. No TLS here;
# browsers accept the Secure session cookie on http://localhost.
server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;
  server_tokens off;

  # SPEC §11 body limit (the API enforces it too).
  client_max_body_size 100k;

  # The API sets its own security headers (helmet).
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The API trusts one proxy hop and reads the client IP from here.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Client-side routes fall back to index.html, which is never cached. Same
  # headers as production so CSP problems show up locally.
  location / {
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri /index.html;
  }
}
