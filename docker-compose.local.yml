# Full system in Docker for local testing (Windows: run `local.cmd start`).
# Builds the app, runs migrations + demo seed, then serves everything at
# http://localhost:8080. Secrets come from .env.docker, generated by
# scripts/local.ps1. Not for production (SPEC §12).
#
# Uses its own project name and ports, so it can run next to
# docker-compose.dev.yml (which uses 5433, 1025 and 8025).
#
# Testing on a real phone: browsing to the PC's LAN IP won't let you sign in.
# The session cookie is Secure, which browsers only allow over plain http on
# localhost, and the CSRF origin check expects http://localhost:8080. On
# Android, connect by USB, open chrome://inspect on the PC, enable "Port
# forwarding" for 8080 -> localhost:8080, then open http://localhost:8080 in
# Chrome on the phone. Otherwise use DevTools device mode.
name: clinic-local

x-app-env: &app-env
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: '4000'
  APP_URL: http://localhost:8080
  LOG_LEVEL: info
  DATABASE_URL: postgresql://app_user:app_user_dev@postgres:5432/clinic
  MIGRATION_DATABASE_URL: postgresql://app_migrator:app_migrator_dev@postgres:5432/clinic
  CLINIC_TIMEZONE: Europe/London
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  EMAIL_FROM: Clinic <no-reply@example.test>

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Not published: reach it with `local.cmd psql`.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/sql/bootstrap.sql:/bootstrap/bootstrap.sql:ro
      - ./deploy/sql/dev-init.sh:/docker-entrypoint-initdb.d/10-dev-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d clinic']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.32
    restart: unless-stopped
    ports:
      - '127.0.0.1:8026:8025'

  # One-shot: apply migrations (as app_migrator), then seed demo data (as app_user).
  migrate:
    build: { context: ., dockerfile: deploy/local/Dockerfile, target: app }
    image: clinic-local-app
    env_file: .env.docker
    environment:
      <<: *app-env
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    command:
      - sh
      - -c
      - >-
        node apps/api/scripts/prisma-migrator.mjs migrate deploy &&
        if [ "$$SEED_DEMO_DATA" = "true" ]; then npm run db:seed; fi
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: clinic-local-app
    env_file: .env.docker
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: deploy/local/Dockerfile, target: web }
    image: clinic-local-web
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
